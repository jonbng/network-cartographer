[package]
name = "network-cartographer"
version = "0.1.0"
description = "Live per-application network connection monitor with traceroute and globe visualization"
authors = ["Jonathan Bangert <jonathan@bangert.dk>"]
license = "MIT"
edition = "2021"
rust-version = "1.88"
repository = "https://github.com/jonbng/network-cartographer"
readme = "../README.md"


[lib]
name = "network_cartographer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
dns-lookup = "2"
netstat2 = "0.11"
sysinfo = "0.33"
thiserror = "2"
parking_lot = "0.12"
ureq = { version = "2", default-features = true, features = ["json"] }
maxminddb = "0.24"
libc = "0.2"
dirs = "6"

[profile.release]
lto = true
codegen-units = 1
strip = true
