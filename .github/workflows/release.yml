name: Release CLI

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            artifact: linux-x86_64
            archive: map-my-network-linux-x86_64.tar.gz
          - os: ubuntu-24.04-arm
            artifact: linux-arm64
            archive: map-my-network-linux-arm64.tar.gz
          - os: macos-15
            artifact: macos-arm64
            archive: map-my-network-macos-arm64.tar.gz
          - os: macos-15-intel
            artifact: macos-x86_64
            archive: map-my-network-macos-x86_64.tar.gz
          - os: windows-latest
            artifact: windows-x86_64
            archive: map-my-network-windows-x86_64.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
          key: release-${{ matrix.artifact }}
      - run: npm ci
      - run: npm run build
      - run: cargo build --release --locked --manifest-path server/Cargo.toml
      - name: Smoke test CLI (Unix)
        if: runner.os != 'Windows'
        run: server/target/release/netcart --help
      - name: Smoke test CLI (Windows)
        if: runner.os == 'Windows'
        run: server/target/release/netcart.exe --help
      - name: Archive CLI (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir "map-my-network-${{ matrix.artifact }}"
          cp "server/target/release/netcart" "map-my-network-${{ matrix.artifact }}/"
          tar -czf "map-my-network-${{ matrix.artifact }}.tar.gz" "map-my-network-${{ matrix.artifact }}"
      - name: Archive CLI (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory "map-my-network-${{ matrix.artifact }}"
          Copy-Item "server/target/release/netcart.exe" "map-my-network-${{ matrix.artifact }}/"
          Compress-Archive "map-my-network-${{ matrix.artifact }}" "map-my-network-${{ matrix.artifact }}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: map-my-network-${{ matrix.artifact }}
          path: ${{ matrix.archive }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: map-my-network-*
          path: release-assets
          merge-multiple: true
      - name: Generate checksums
        working-directory: release-assets
        run: sha256sum map-my-network-* > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          draft: false
          generate_release_notes: true
          body: |
            ## Run it

            macOS or Linux:

            ```bash
            curl -fsSL https://github.com/jonbng/network-cartographer/releases/latest/download/run.sh | sh
            ```

            Windows PowerShell:

            ```powershell
            irm https://github.com/jonbng/network-cartographer/releases/latest/download/run.ps1 | iex
            ```

            The launcher selects the correct binary, verifies its SHA-256 checksum, runs it as the current user, and removes the temporary download after exit.
          files: |
            release-assets/*
            scripts/run.sh
            scripts/run.ps1
