[package]
name = "network-cartographer"
version = "0.1.1"
description = "Live per-application network connection monitor with traceroute and globe visualization"
authors = ["Jonathan Bangert <jonathan@bangert.dk>"]
license = "MIT"
edition = "2021"
rust-version = "1.88"
repository = "https://github.com/jonbng/network-cartographer"
readme = "../README.md"


[lib]
name = "network_cartographer_lib"
crate-type = ["rlib"]

[[bin]]
name = "netcart"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
dns-lookup = "2"
netstat2 = "0.11"
sysinfo = "0.33"
thiserror = "2"
parking_lot = "0.12"
ureq = { version = "2", default-features = true, features = ["json"] }
maxminddb = "0.24"
dirs = "6"
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync"] }
tokio-stream = { version = "0.1", features = ["sync"] }
rust-embed = "8"
mime_guess = "2"
webbrowser = "1"
futures-util = { version = "0.3", default-features = false, features = ["std", "async-await"] }

[target.'cfg(target_os = "linux")'.dependencies]
netlink-packet-core = "0.7"
netlink-packet-sock-diag = { version = "0.4.2", features = ["rich_nlas"] }
netlink-sys = "0.8"

[profile.release]
lto = true
codegen-units = 1
strip = true
