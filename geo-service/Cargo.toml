[package]
name = "mapmy-geo-service"
version = "0.1.0"
edition = "2021"
description = "Private GeoLite2 lookup service for Network Cartographer hosted geo"
license = "MIT"
publish = false

[[bin]]
name = "mapmy-geo"
path = "src/main.rs"

[dependencies]
axum = "0.8"
maxminddb = "0.27"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync"] }
tower-http = { version = "0.6", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
